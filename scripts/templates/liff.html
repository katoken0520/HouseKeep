<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家計簿入力フォーム</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .nav-pills .nav-link.active { background-color: #0b2545; }
    .btn-primary { background-color: #0b2545; border-color: #0b2545; }
    .scrollable-list { max-height: 60vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .chart-container { position: relative; height: 220px; width: 100%; margin-bottom: 15px; }
    .help-btn { width: 32px; height: 32px; padding: 0; line-height: 1; border-color: #ced4da; color: #6c757d; }
    ::placeholder { color: #adb5bd !important; opacity: 0.6 !important; }
  </style>
</head>
<body class="p-3">

  <div id="loading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted">LINE認証中...</p>
  </div>

  <div id="main-content" style="display: none;">
    
    <div class="d-flex justify-content-between align-items-center mb-3 px-1">
      <h5 class="fw-bold mb-0" style="color: #0b2545;">入力フォーム</h5>
      <button class="btn btn-outline-secondary rounded-circle fw-bold help-btn" data-bs-toggle="modal" data-bs-target="#helpModal">?</button>
    </div>

    <ul class="nav nav-pills nav-fill mb-3" id="pills-tab" role="tablist">
      <li class="nav-item"><button class="nav-link active" id="tab-exp" data-bs-toggle="pill" data-bs-target="#content-exp">💸 支出</button></li>
      <li class="nav-item"><button class="nav-link" id="tab-inc" data-bs-toggle="pill" data-bs-target="#content-inc">💰 収入</button></li>
      <li class="nav-item"><button class="nav-link" id="tab-rec" data-bs-toggle="pill" data-bs-target="#content-rec" onclick="loadRecent()">📜 履歴</button></li>
      <li class="nav-item"><button class="nav-link" id="tab-sum" data-bs-toggle="pill" data-bs-target="#content-sum" onclick="loadSummary()">📊 概要</button></li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
      
      <div class="tab-pane fade show active" id="content-exp">
        <div class="card p-3 shadow-sm">
          <div class="mb-3">
            <label class="form-label font-weight-bold">区分</label>
            <div class="btn-group w-100" role="group">
              <input type="radio" class="btn-check" name="exp-shared" id="sh-0" value="0" checked>
              <label class="btn btn-outline-secondary" for="sh-0">👤 個人用</label>
              <input type="radio" class="btn-check" name="exp-shared" id="sh-1" value="1">
              <label class="btn btn-outline-primary" for="sh-1">👪 共有用</label>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">項目</label>
            <select id="exp-category" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label class="form-label">金額 (円)</label>
            <input type="number" id="exp-amount" class="form-control" inputmode="numeric">
          </div>
          <div class="mb-3">
            <label class="form-label">日付</label>
            <input type="date" id="exp-date" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">備考</label>
            <input type="text" id="exp-memo" class="form-control" placeholder="メモ（任意）">
          </div>
          <button class="btn btn-primary btn-lg w-100" onclick="submitTransaction('EXPENSE')">支出を登録する</button>
        </div>
      </div>

      <div class="tab-pane fade" id="content-inc">
        <div class="card p-3 shadow-sm">
          <div class="mb-3">
            <label class="form-label">項目</label>
            <select id="inc-category" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label class="form-label">金額 (円)</label>
            <input type="number" id="inc-amount" class="form-control" inputmode="numeric">
          </div>
          <div class="mb-3">
            <label class="form-label">日付</label>
            <input type="date" id="inc-date" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">備考</label>
            <input type="text" id="inc-memo" class="form-control" placeholder="メモ（任意）">
          </div>
          <button class="btn btn-success btn-lg w-100" onclick="submitTransaction('INCOME')">収入を登録する</button>
        </div>
      </div>

      <div class="tab-pane fade" id="content-rec">
        <div class="card p-2 shadow-sm">
          <h6 class="px-2 pt-2 fw-bold">過去の入力履歴</h6>
          <div class="scrollable-list">
            <ul id="recent-list" class="list-group list-group-flush"></ul>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="content-sum">
        <div class="card p-3 shadow-sm">
          <h6 class="text-center text-muted small">過去30日間の総支出</h6>
          <h2 id="sum-total" class="text-center text-primary fw-bold mb-3">0 円</h2>
          
          <div class="chart-container">
            <canvas id="categoryPieChart"></canvas>
          </div>
          
          <div class="mb-3">
            <h6 class="fw-bold small text-muted mb-2">📂 項目別内訳</h6>
            <ul id="sum-category-list" class="list-group list-group-flush small"></ul>
          </div>

          <hr>
          
          <h6 class="mt-2 fw-bold small text-muted">👪 共有会計の負担状況</h6>
          <div id="sum-shared-text" class="text-center mb-2 small"></div>
          <div style="height: 80px; width: 100%;">
            <canvas id="sharedBarChart"></canvas>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="modal fade" id="helpModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title fw-bold">📖 使い方ガイド</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body small">
          <p class="fw-bold mb-1">✅ 基本的な使い方</p>
          <p class="text-muted mb-3">金額や項目を入力して「登録」を押してください。「履歴」タブから直近のデータを削除・確認できます。</p>
          
          <p class="fw-bold mb-1">👪 共有用・個人用の違い</p>
          <p class="text-muted mb-0">「共有用」で登録したデータは、全体の共有支出として別枠で集計され、「概要」タブのグラフで負担割合を確認できます。</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    const LIFF_ID = "2010989817-SOF5ZiXe";
    let userId = "";
    
    let pieChartInstance = null;
    let barChartInstance = null;

    document.addEventListener("DOMContentLoaded", function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('exp-date').value = today;
      document.getElementById('inc-date').value = today;

      liff.init({ liffId: LIFF_ID }).then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          liff.getProfile().then(profile => {
            userId = profile.userId;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            loadCategories();
          });
        }
      }).catch(err => alert("LIFF初期化エラー: " + err));
    });

    function loadCategories() {
      fetch(`/api/categories?type=expense_categories&user_id=${userId}`)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'error') {
            alert(data.message);
            return;
          }
          document.getElementById('exp-category').innerHTML = data.categories.map(c => `<option value="${c}">${c}</option>`).join('');
        });

      fetch(`/api/categories?type=income_categories&user_id=${userId}`)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'error') return;
          document.getElementById('inc-category').innerHTML = data.categories.map(c => `<option value="${c}">${c}</option>`).join('');
        });
    }

    function submitTransaction(type) {
      const isExp = type === 'EXPENSE';
      const amountInput = document.getElementById(isExp ? 'exp-amount' : 'inc-amount');
      const memoInput = document.getElementById(isExp ? 'exp-memo' : 'inc-memo');
      const amount = amountInput.value;
      const category = document.getElementById(isExp ? 'exp-category' : 'inc-category').value;
      const date = document.getElementById(isExp ? 'exp-date' : 'inc-date').value;
      const memo = memoInput.value;
      const isShared = isExp ? document.querySelector('input[name="exp-shared"]:checked').value : 0;

      if (!amount || amount <= 0) return alert("金額を入力してください。");

      fetch('/api/transaction', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId, type: type, category: category, amount: amount, date: date, memo: memo, is_shared: isShared })
      }).then(res => res.json()).then(data => {
        if (data.status === 'success') {
          alert("登録しました！");
          amountInput.value = "";
          memoInput.value = "";
        } else {
          alert("エラー: " + data.message);
        }
      });
    }

    function loadRecent() {
      fetch(`/api/recent?user_id=${userId}`)
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById('recent-list');
          list.innerHTML = data.transactions.map(tx => {
            const isExp = tx.type === 'EXPENSE';
            const typeBadge = isExp ? '<span class="badge bg-danger">出</span>' : '<span class="badge bg-success">入</span>';
            const sharedBadge = (isExp && tx.is_shared === 1) ? '<span class="badge bg-primary rounded-pill">👪 共有</span>' : '<span class="badge bg-secondary rounded-pill">👤 個人</span>';
            
            return `
            <li class="list-group-item d-flex justify-content-between align-items-center py-2 px-1">
              <div style="flex-grow: 1;">
                <div class="d-flex justify-content-between mb-1">
                  <small class="text-muted">${tx.date}</small>
                  ${sharedBadge}
                </div>
                <div>
                  ${typeBadge} <strong>${tx.category}</strong>: ${tx.amount.toLocaleString()}円
                </div>
              </div>
              <button class="btn btn-sm btn-outline-danger ms-2" onclick="deleteTx('${tx.type}', ${tx.id})">削除</button>
            </li>
            `;
          }).join('');
        });
    }

    function deleteTx(type, id) {
      if (!confirm("データを削除しますか？")) return;
      fetch('/api/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId, type: type, id: id }) // 💡 user_id を追加
      }).then(res => res.json()).then(data => {
        if (data.status === 'success') {
          loadRecent();
        } else {
          alert("エラー: " + data.message);
        }
      });
    }

    function loadSummary() {
      fetch(`/api/summary?user_id=${userId}`)
        .then(res => res.json())
        .then(data => {
          const totalAmount = data.total_amount || 0;
          document.getElementById('sum-total').innerText = totalAmount.toLocaleString() + " 円";
          
          const catNames = data.categories.map(c => c.name);
          const catAmounts = data.categories.map(c => c.amount);
          
          const catListHtml = data.categories.map(c => {
            const pct = totalAmount > 0 ? ((c.amount / totalAmount) * 100).toFixed(1) : "0.0";
            return `
              <li class="list-group-item d-flex justify-content-between align-items-center py-1 px-1">
                <span>${c.name}</span>
                <span><strong>${c.amount.toLocaleString()} 円</strong> <small class="text-muted">(${pct}%)</small></span>
              </li>
            `;
          }).join('');
          document.getElementById('sum-category-list').innerHTML = catListHtml || '<li class="list-group-item text-muted text-center py-2">データがありません</li>';

          if(pieChartInstance) pieChartInstance.destroy();
          const ctxPie = document.getElementById('categoryPieChart').getContext('2d');
          pieChartInstance = new Chart(ctxPie, {
            type: 'doughnut',
            data: {
              labels: catNames,
              datasets: [{
                data: catAmounts,
                backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#C9CBCF', '#7BC225']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  position: 'right',
                  labels: {
                    boxWidth: 12,
                    font: { size: 11 },
                    generateLabels: function(chart) {
                      const data = chart.data;
                      if (data.labels.length && data.datasets.length) {
                        const total = data.datasets[0].data.reduce((a, b) => a + b, 0);
                        return data.labels.map((label, i) => {
                          const value = data.datasets[0].data[i];
                          const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                          return {
                            text: `${label} (${percentage}%)`,
                            fillStyle: data.datasets[0].backgroundColor[i],
                            hidden: isNaN(data.datasets[0].data[i]) || chart.getDatasetMeta(0).data[i].hidden,
                            index: i
                          };
                        });
                      }
                      return [];
                    }
                  }
                },
                tooltip: {
                  callbacks: {
                    label: function(context) {
                      const value = context.raw || 0;
                      const total = context.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                      const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                      return ` ${context.label}: ${value.toLocaleString()}円 (${percentage}%)`;
                    }
                  }
                }
              }
            }
          });

          const totalShared = data.total_shared || 0;
          const userShared = data.user_shared || 0;
          const otherShared = totalShared - userShared;
          
          // 💡 計算したパーセンテージを算出し、テキスト部分に埋め込み！
          const sharedPct = totalShared > 0 ? ((userShared / totalShared) * 100).toFixed(1) : "0.0";
          document.getElementById('sum-shared-text').innerHTML = `あなた: <strong>${userShared.toLocaleString()}円 (${sharedPct}%)</strong> / 全体: <strong>${totalShared.toLocaleString()}円</strong>`;

          if(barChartInstance) barChartInstance.destroy();
          const ctxBar = document.getElementById('sharedBarChart').getContext('2d');
          
          if(totalShared > 0) {
            barChartInstance = new Chart(ctxBar, {
              type: 'bar',
              data: {
                labels: ['負担割合'],
                datasets: [
                  { label: 'あなたの負担', data: [userShared], backgroundColor: '#36A2EB' },
                  { label: 'その他', data: [otherShared], backgroundColor: '#E0E0E0' }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                indexAxis: 'y',
                scales: {
                  x: { stacked: true, max: totalShared, display: false },
                  y: { stacked: true, display: false }
                },
                plugins: { legend: { display: false } }
              }
            });
          }
        });
    }
  </script>
</body>
</html>
