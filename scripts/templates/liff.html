<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家計簿入力フォーム</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .nav-pills .nav-link.active { background-color: #0b2545; }
    .btn-primary { background-color: #0b2545; border-color: #0b2545; }
    /* 💡 スマホで滑らかにスクロールさせる設定 */
    .scrollable-list { max-height: 60vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .chart-container { position: relative; height: 250px; width: 100%; margin-bottom: 20px; }
  </style>
</head>
<body class="p-3">

  <div id="loading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted">LINE認証中...</p>
  </div>

  <div id="main-content" style="display: none;">
    <ul class="nav nav-pills nav-fill mb-3" id="pills-tab" role="tablist">
      <li class="nav-item"><button class="nav-link active" id="tab-exp" data-bs-toggle="pill" data-bs-target="#content-exp">💸 支出</button></li>
      <li class="nav-item"><button class="nav-link" id="tab-inc" data-bs-toggle="pill" data-bs-target="#content-inc">💰 収入</button></li>
      <li class="nav-item"><button class="nav-link" id="tab-rec" data-bs-toggle="pill" data-bs-target="#content-rec" onclick="loadRecent()">📜 履歴</button></li>
      <li class="nav-item"><button class="nav-link" id="tab-sum" data-bs-toggle="pill" data-bs-target="#content-sum" onclick="loadSummary()">📊 概要</button></li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
      
      <div class="tab-pane fade show active" id="content-exp">
        <div class="card p-3 shadow-sm">
          <div class="mb-3">
            <label class="form-label font-weight-bold">区分</label>
            <div class="btn-group w-100" role="group">
              <input type="radio" class="btn-check" name="exp-shared" id="sh-0" value="0" checked>
              <label class="btn btn-outline-secondary" for="sh-0">👤 個人用</label>
              <input type="radio" class="btn-check" name="exp-shared" id="sh-1" value="1">
              <label class="btn btn-outline-primary" for="sh-1">👪 共有用</label>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">項目</label>
            <select id="exp-category" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label class="form-label">金額 (円)</label>
            <input type="number" id="exp-amount" class="form-control form-control-lg" placeholder="1000" inputmode="numeric">
          </div>
          <div class="mb-3">
            <label class="form-label">日付</label>
            <input type="date" id="exp-date" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">備考</label>
            <input type="text" id="exp-memo" class="form-control" placeholder="メモ（任意）">
          </div>
          <button class="btn btn-primary btn-lg w-100" onclick="submitTransaction('EXPENSE')">支出を登録する</button>
        </div>
      </div>

      <div class="tab-pane fade" id="content-inc">
        <div class="card p-3 shadow-sm">
          <div class="mb-3">
            <label class="form-label">項目</label>
            <select id="inc-category" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label class="form-label">金額 (円)</label>
            <input type="number" id="inc-amount" class="form-control form-control-lg" placeholder="50000" inputmode="numeric">
          </div>
          <div class="mb-3">
            <label class="form-label">日付</label>
            <input type="date" id="inc-date" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">備考</label>
            <input type="text" id="inc-memo" class="form-control">
          </div>
          <button class="btn btn-success btn-lg w-100" onclick="submitTransaction('INCOME')">収入を登録する</button>
        </div>
      </div>

      <div class="tab-pane fade" id="content-rec">
        <div class="card p-2 shadow-sm">
          <h6 class="px-2 pt-2">過去の入力履歴</h6>
          <div class="scrollable-list">
            <ul id="recent-list" class="list-group list-group-flush"></ul>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="content-sum">
        <div class="card p-3 shadow-sm">
          <h6 class="text-center">過去30日間の総支出</h6>
          <h2 id="sum-total" class="text-center text-primary fw-bold mb-4">0 円</h2>
          
          <div class="chart-container">
            <canvas id="categoryPieChart"></canvas>
          </div>
          
          <hr>
          
          <h6 class="mt-3">👪 共有会計の負担状況</h6>
          <div id="sum-shared-text" class="text-center mb-2 small text-muted"></div>
          <div style="height: 100px; width: 100%;">
            <canvas id="sharedBarChart"></canvas>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const LIFF_ID = "2010989817-SOF5ZiXe"; // ⚠️ ご自身のLIFF IDに書き換えてください！
    let userId = "";
    
    // グラフオブジェクトを保持する変数（再描画時のチラつき防止用）
    let pieChartInstance = null;
    let barChartInstance = null;

    document.addEventListener("DOMContentLoaded", function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('exp-date').value = today;
      document.getElementById('inc-date').value = today;

      liff.init({ liffId: LIFF_ID }).then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          liff.getProfile().then(profile => {
            userId = profile.userId;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            loadCategories();
          });
        }
      }).catch(err => alert("LIFF初期化エラー: " + err));
    });

    function loadCategories() {
      fetch('/api/categories?type=expense_categories').then(res => res.json()).then(data => {
        document.getElementById('exp-category').innerHTML = data.categories.map(c => `<option value="${c}">${c}</option>`).join('');
      });
      fetch('/api/categories?type=income_categories').then(res => res.json()).then(data => {
        document.getElementById('inc-category').innerHTML = data.categories.map(c => `<option value="${c}">${c}</option>`).join('');
      });
    }

    function submitTransaction(type) {
      const isExp = type === 'EXPENSE';
      const amount = document.getElementById(isExp ? 'exp-amount' : 'inc-amount').value;
      const category = document.getElementById(isExp ? 'exp-category' : 'inc-category').value;
      const date = document.getElementById(isExp ? 'exp-date' : 'inc-date').value;
      const memo = document.getElementById(isExp ? 'exp-memo' : 'inc-memo').value;
      const isShared = isExp ? document.querySelector('input[name="exp-shared"]:checked').value : 0;

      if (!amount || amount <= 0) return alert("金額を入力してください。");

      fetch('/api/transaction', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId, type: type, category: category, amount: amount, date: date, memo: memo, is_shared: isShared })
      }).then(res => res.json()).then(data => {
        if (data.status === 'success') {
          alert("登録しました！");
          liff.closeWindow();
        } else {
          alert("エラー: " + data.message);
        }
      });
    }

    // 💡 履歴読み込み（スクロールリスト生成）
    function loadRecent() {
      fetch(`/api/recent?user_id=${userId}`)
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById('recent-list');
          list.innerHTML = data.transactions.map(tx => {
            const isExp = tx.type === 'EXPENSE';
            const typeBadge = isExp ? '<span class="badge bg-danger">出</span>' : '<span class="badge bg-success">入</span>';
            const sharedBadge = (isExp && tx.is_shared === 1) ? '<span class="badge bg-primary rounded-pill">👪 共有</span>' : '<span class="badge bg-secondary rounded-pill">👤 個人</span>';
            
            return `
            <li class="list-group-item d-flex justify-content-between align-items-center py-2">
              <div style="flex-grow: 1;">
                <div class="d-flex justify-content-between mb-1">
                  <small class="text-muted">${tx.date}</small>
                  ${sharedBadge}
                </div>
                <div>
                  ${typeBadge} <strong>${tx.category}</strong>: ${tx.amount.toLocaleString()}円
                </div>
              </div>
              <button class="btn btn-sm btn-outline-danger ms-3" onclick="deleteTx('${tx.type}', ${tx.id})">削除</button>
            </li>
            `;
          }).join('');
        });
    }

    function deleteTx(type, id) {
      if (!confirm("データを削除しますか？")) return;
      fetch('/api/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: type, id: id })
      }).then(res => res.json()).then(data => {
        if (data.status === 'success') loadRecent();
      });
    }

    // 💡 グラフ描画を含むサマリー読み込み
    function loadSummary() {
      fetch(`/api/summary?user_id=${userId}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('sum-total').innerText = data.total_amount.toLocaleString() + " 円";
          
          // --- 1. 項目別 円グラフ ---
          const catNames = data.categories.map(c => c.name);
          const catAmounts = data.categories.map(c => c.amount);
          
          if(pieChartInstance) pieChartInstance.destroy(); // 古いグラフを破棄
          const ctxPie = document.getElementById('categoryPieChart').getContext('2d');
          pieChartInstance = new Chart(ctxPie, {
            type: 'doughnut',
            data: {
              labels: catNames,
              datasets: [{
                data: catAmounts,
                backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#C9CBCF', '#7BC225']
              }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
          });

          // --- 2. 共有会計 横棒グラフ ---
          const totalShared = data.total_shared || 0;
          const userShared = data.user_shared || 0;
          const otherShared = totalShared - userShared;
          
          document.getElementById('sum-shared-text').innerHTML = `全体: <strong>${totalShared.toLocaleString()}円</strong> / あなた: <strong>${userShared.toLocaleString()}円</strong>`;

          if(barChartInstance) barChartInstance.destroy();
          const ctxBar = document.getElementById('sharedBarChart').getContext('2d');
          
          if(totalShared > 0) {
            barChartInstance = new Chart(ctxBar, {
              type: 'bar',
              data: {
                labels: ['負担割合'],
                datasets: [
                  { label: 'あなたの負担', data: [userShared], backgroundColor: '#36A2EB' },
                  { label: 'その他', data: [otherShared], backgroundColor: '#E0E0E0' }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                indexAxis: 'y', // 横棒グラフにする
                scales: {
                  x: { stacked: true, max: totalShared, display: false },
                  y: { stacked: true, display: false }
                },
                plugins: { legend: { display: false } }
              }
            });
          }
        });
    }
  </script>
</body>
</html>
